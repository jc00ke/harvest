[tools]
go = "1.26.3"

[tasks.build]
run = "go build -o bin/harvest ./cmd/harvest"

[tasks.test]
run = "go test -v ./..."

[tasks.lint]
run = "go vet ./..."

[tasks.fmt]
run = "go fmt ./..."

[tasks.check]
depends = ["fmt", "lint", "test"]

[tasks.run]
depends = ["build"]
run = "./bin/harvest"

[tasks.run-ui]
depends = ["build"]
run = "./bin/harvest -ui"

[tasks.clean]
run = "rm -rf bin/"
