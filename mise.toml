[tools]
go = "1.27.0"
goreleaser = "latest"
usage = "6.5.0"
cosign = "latest"

[tasks.build]
run = "go build -o bin/harvest ./cmd/harvest"

[tasks.test]
run = "go test -v ./..."

[tasks.lint]
run = "go vet ./..."

[tasks.fmt]
run = "go fmt ./..."

# Kept out of `check` so the commit gate stays offline-friendly; CI runs it on
# every push.
[tasks.vuln]
description = "Scan dependencies and code for known vulnerabilities"
run = "go run golang.org/x/vuln/cmd/govulncheck@latest ./..."

[tasks.check]
depends = ["fmt", "lint", "test"]

[tasks.run]
depends = ["build"]
run = "./bin/harvest"

[tasks.run-ui]
depends = ["build"]
run = "./bin/harvest -ui"

[tasks.clean]
run = "rm -rf bin/"

# VHS also needs ttyd, which mise can't install on macOS (no darwin builds
# in its registry backends) — install it with `brew install ttyd`.
[tasks.screenshots]
description = "Regenerate README screenshots by driving the demo-mode TUI with VHS"
depends = ["build"]
tools = { vhs = "latest", ffmpeg = "latest" }
run = """
#!/usr/bin/env bash
set -euo pipefail
if ! command -v ttyd > /dev/null; then
  echo "error: vhs requires ttyd; install it with \\`brew install ttyd\\` (macOS) or your package manager" >&2
  exit 1
fi
vhs demo.tape
"""

[tasks."release:verify"]
description = "Download a release's artifacts and verify their attestations, e.g. mise run release:verify v0.1.0"
usage = 'arg "[version]" help="Release tag to verify, defaults to the latest release"'
run = '''
#!/usr/bin/env bash
set -euo pipefail

repo="jc00ke/harvest"
version="${usage_version:-}"
if [[ -z "$version" ]]; then
  version=$(gh release view --json tagName --jq .tagName -R "$repo")
fi

tmpdir=$(mktemp -d)
trap 'echo "verification failed, artifacts left in $tmpdir for inspection" >&2' ERR

echo "Downloading $version artifacts to $tmpdir"
gh release download "$version" -R "$repo" \
  -p '*.tar.gz' -p 'checksums.txt' -p 'checksums.txt.bundle' \
  -D "$tmpdir"

for artifact in "$tmpdir"/*.tar.gz; do
  gh attestation verify "$artifact" -R "$repo"
done

echo "Verifying cosign signature on checksums.txt"
cosign verify-blob \
  --bundle "$tmpdir/checksums.txt.bundle" \
  --certificate-identity-regexp "^https://github.com/$repo/.github/workflows/release.yml@" \
  --certificate-oidc-issuer https://token.actions.githubusercontent.com \
  "$tmpdir/checksums.txt"

rm -rf "$tmpdir"
echo "All $version artifacts verified, cleaned up $tmpdir"
'''

[tasks.release]
description = "Tag a release and push it to trigger the release workflow, e.g. mise run release v0.1.0"
depends = ["check"]
usage = 'arg "<version>" help="Version to tag, e.g. v0.1.0"'
run = '''
#!/usr/bin/env bash
set -euo pipefail

version="${usage_version:?}"

if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
  echo "error: version must look like v1.2.3, got: $version" >&2
  exit 1
fi

branch=$(git rev-parse --abbrev-ref HEAD)
if [[ "$branch" != "main" ]]; then
  echo "error: releases must be tagged from main, currently on $branch" >&2
  exit 1
fi

if [[ -n "$(git status --porcelain)" ]]; then
  echo "error: working tree is dirty, commit or stash first" >&2
  exit 1
fi

git fetch origin main
if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]]; then
  echo "error: HEAD is not in sync with origin/main, push or pull first" >&2
  exit 1
fi

git tag -s "$version" -m "$version"
git push origin "$version"
echo "Pushed $version. Watch the release at https://github.com/jc00ke/harvest/actions"
'''
