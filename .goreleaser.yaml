version: 2

before:
  hooks:
    - ./scripts/completions.sh

builds:
  - main: ./cmd/harvest
    binary: harvest
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - completions/*

changelog:
  sort: asc
