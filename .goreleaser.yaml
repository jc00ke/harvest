version: 2

before:
  hooks:
    - ./scripts/completions.sh

builds:
  - main: ./cmd/harvest
    binary: harvest
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - completions/*

homebrew_casks:
  - name: harvest
    repository:
      owner: jc00ke
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/jc00ke/harvest"
    description: "A command-line tool for managing your Harvest time entries, projects, and tasks"
    license: "MIT"
    completions:
      bash: "completions/harvest.bash"
      zsh: "completions/harvest.zsh"
      fish: "completions/harvest.fish"
    # The release binaries are attested via GitHub but not Apple-signed, so
    # macOS quarantines them. Strip the quarantine attribute on install.
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/harvest"]
          end

checksum:
  name_template: "checksums.txt"

# Keyless cosign signing of the checksums file. One signature covers every
# archive transitively. The OIDC token comes from the release workflow's
# id-token: write permission; --yes is required for non-interactive signing.
signs:
  - cmd: cosign
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--output-signature=${signature}"
      - "--output-certificate=${certificate}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

changelog:
  sort: asc
